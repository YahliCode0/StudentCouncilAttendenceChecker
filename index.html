<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Club Roster & Attendance Tracker</title>
  <style>
    :root {
      --bg-primary: #f8fafc;
      --bg-card: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --danger: #ef4444;
      --success: #22c55e;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
    }

    [data-theme="dark"] {
      --bg-primary: #0f172a;
      --bg-card: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --danger: #f87171;
      --success: #4ade80;
    }

    * {
      box-sizing: border-box;
      transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease, transform 0.15s ease, box-shadow 0.15s ease;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-main);
      margin: 0;
      padding: 2rem;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 900px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    /* Header & Controls */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 1rem;
      border-bottom: 2px solid var(--border-color);
    }

    .theme-toggle-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      box-shadow: var(--shadow-sm);
    }

    .theme-toggle-btn:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    /* Drag & Drop Area */
    .drop-zone {
      border: 2px dashed var(--accent);
      border-radius: 12px;
      padding: 2.5rem;
      text-align: center;
      background-color: var(--bg-card);
      cursor: pointer;
      box-shadow: var(--shadow-sm);
    }

    .drop-zone:hover, .drop-zone.dragover {
      transform: scale(1.01);
      box-shadow: var(--shadow-lg);
      border-color: var(--accent-hover);
      background-color: rgba(79, 70, 229, 0.04);
    }

    /* Interactive Stats Bar */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
    }

    .stat-card {
      background: var(--bg-card);
      padding: 1.25rem;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
    }

    .stat-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
    }

    /* Search Input */
    .search-bar {
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-main);
      font-size: 1rem;
      outline: none;
    }

    .search-bar:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
    }

    /* List Rows */
    .member-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 1rem;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      margin-bottom: 0.5rem;
    }

    .member-row:hover {
      transform: translateX(4px);
      border-color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h2>Attendance Hub</h2>
      <button class="theme-toggle-btn" id="themeToggle">🌙 Dark Mode</button>
    </div>

    <!-- Drag & Drop Upload Zone -->
    <div class="drop-zone" id="dropZone">
      <p>📁 Drag and drop your attendance CSV file here, or <strong>click to browse</strong></p>
      <input type="file" id="fileInput" accept=".csv" style="display: none;">
    </div>

    <!-- Live Search Bar -->
    <input type="text" id="searchInput" class="search-bar" placeholder="Search missing members by name...">

    <!-- Attendance Stats Cards -->
    <div class="stats-grid">
      <div class="stat-card">
        <small style="color: var(--text-muted)">Present</small>
        <h3 id="presentCount" style="color: var(--success); margin: 0.25rem 0 0 0;">0</h3>
      </div>
      <div class="stat-card">
        <small style="color: var(--text-muted)">Missing</small>
        <h3 id="missingCount" style="color: var(--danger); margin: 0.25rem 0 0 0;">0</h3>
      </div>
      <div class="stat-card">
        <small style="color: var(--text-muted)">Attendance Rate</small>
        <h3 id="ratePercent" style="color: var(--accent); margin: 0.25rem 0 0 0;">0%</h3>
      </div>
    </div>
  </div>

  <script>
    // Theme Toggle Logic
    const themeBtn = document.getElementById('themeToggle');
    themeBtn.addEventListener('click', () => {
      const isDark = document.body.getAttribute('data-theme') === 'dark';
      document.body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      themeBtn.textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    });

    // Drag and Drop Event Listeners
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');

    dropZone.addEventListener('click', () => fileInput.click());

    ['dragenter', 'dragover'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        dropZone.classList.add('dragover');
      }, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
      }, false);
    });

    dropZone.addEventListener('drop', (e) => {
      const files = e.dataTransfer.files;
      if (files.length) {
        fileInput.files = files;
        // Trigger file processing logic here
      }
    });
  </script>
</body>
</html>
