    const fileInput = document.getElementById('csvFileInput');
    const fileNameDiv = document.getElementById('fileName');

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        fileNameDiv.textContent = file.name;
        Papa.parse(file, {
          skipEmptyLines: true,
          complete: (results) => checkMissing(results.data)
        });
      }
    });

    function cleanStr(str) {
      return String(str || '').toLowerCase().replace(/[^a-z0-9]/g, '');
    }

    function checkMissing(csvRows) {
      const rowStrings = csvRows.map(row => {
        if (Array.isArray(row)) {
          return cleanStr(row.join(' '));
        } else if (typeof row === 'object' && row !== null) {
          return cleanStr(Object.values(row).join(' '));
        }
        return cleanStr(row);
      });

      const missing = [];

      masterList.forEach(member => {
        const mFirst = cleanStr(member.first);
        const mLast = cleanStr(member.last);
        const mEmail = cleanStr(member.email);
        const mName = cleanStr(member.name);

        const mFirstShort = mFirst.length >= 4 ? mFirst.slice(0, 4) : mFirst;
        const mLastShort = mLast.length >= 4 ? mLast.slice(0, 4) : mLast;

        let found = false;

        for (const rowText of rowStrings) {
          if (!rowText) continue;

          if (rowText.includes(mEmail) || rowText.includes(mName)) {
            found = true;
            break;
          }

          const firstMatch = rowText.includes(mFirst) || (mFirstShort && rowText.includes(mFirstShort));
          const lastMatch = rowText.includes(mLast) || (mLastShort && rowText.includes(mLastShort));

          if (firstMatch && lastMatch) {
            found = true;
            break;
          }
        }

        if (!found) {
          missing.push(member.name);
        }
      });

      const resultsUl = document.getElementById('results');
      resultsUl.innerHTML = '';
      document.getElementById('count').textContent = missing.length;

      if (missing.length === 0) {
        const li = document.createElement('li');
        li.textContent = 'All 49 Student Council members are present!';
        li.style.color = '#2e7d32';
        resultsUl.appendChild(li);
      } else {
        missing.forEach(name => {
          const li = document.createElement('li');
          li.textContent = name;
          resultsUl.appendChild(li);
        });
      }
    }
